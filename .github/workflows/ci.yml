name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Verify Go Module
      run: go mod verify

    - name: Check Code Formatting (gofmt)
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "The following files are not formatted properly:"
          gofmt -l .
          exit 1
        fi

    - name: Run Vulnerability Check (govulncheck)
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v2.1

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        go-version: ['1.24.x']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Run Unit Tests & Calculate Coverage
      run: |
        PACKAGES=$(go list ./... | grep -v /examples)
        go test -v -race -coverprofile=coverage.out -covermode=atomic $PACKAGES

    - name: Generate Coverage Report
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        echo "COVERAGE_PCT=$COVERAGE" >> $GITHUB_ENV

        echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Total Core Code Coverage:** \`$COVERAGE\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Comment Coverage on PR
      if: github.event_name == 'pull_request' && matrix.go-version == '1.24.x'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: code-coverage-report
        message: |
          ### 📊 Rateshield Test Coverage Report
          - **Total Code Coverage:** `${{ env.COVERAGE_PCT }}`
          - **Race Detector:** Passed ✅
          - **Matrix Go Version:** `${{ matrix.go-version }}`
